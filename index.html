<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vector">
<meta name="theme-color" content="#EFEAE1">
<title>Vector — Direction with Intent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EFEAE1;
    --bg-deep: #E6DFCF;
    --surface: #FFFFFF;
    --surface-alt: #F6F2E8;
    --ink: #23252B;
    --ink-soft: #62636B;
    --ink-faint: #97968D;
    --line: #DCD4C1;
    --line-strong: #C7BCA2;
    --todo: #5B6472;
    --todo-bg: #E9EBEE;
    --progress: #B96A20;
    --progress-bg: #F5E3CB;
    --done: #3F7D58;
    --done-bg: #DEEBE1;
    --suspended: #6B5B95;
    --suspended-bg: #E7E1F0;
    --streak: #B68A16;
    --streak-bg: #F3E8C6;
    --active-day-bg: #BFE3C4;
    --active-day-fg: #1F5C33;
    --danger: #A6412A;
    --pri-none: #3B6FA8;
    --pri-low: #4C8C5B;
    --pri-high: #C98A2E;
    --pri-veryhigh: #B23B2E;
    --pri-urgent: #C81E3A;
    --radius: 10px;
    --radius-lg: 16px;
    --shadow-card: 0 1px 0 rgba(35,37,43,0.06), 0 1px 3px rgba(35,37,43,0.08);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans', -apple-system, sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
  .serif{font-family:'Fraunces', serif;}
  #app{max-width:1180px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);}
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;color:var(--ink);}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{background:var(--surface);border-radius:20px;padding:28px 24px;max-width:380px;width:100%;box-shadow:var(--shadow-card);}
  .login-card .brand{display:flex;justify-content:center;margin-bottom:4px;}
  .login-card .sub{text-align:center;font-size:13px;color:var(--ink-faint);margin:0 0 20px;}
  .user-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .user-chip-btn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface-alt);border-radius:12px;padding:10px 12px;font-size:14.5px;font-weight:600;text-align:left;width:100%;}
  .user-avatar{width:32px;height:32px;border-radius:50%;background:var(--progress);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fraunces';font-weight:600;font-size:14px;flex-shrink:0;}
  .add-user-row{display:flex;gap:8px;margin-top:6px;}
  .add-user-row input{flex:1;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:14px;}
  .current-user-badge{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink-soft);background:var(--surface-alt);padding:5px 10px 5px 6px;border-radius:999px;}
  .current-user-badge .user-avatar{width:22px;height:22px;font-size:11px;}
  .logout-btn{border:none;background:none;color:var(--ink-faint);font-size:11.5px;text-decoration:underline;padding:2px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px 10px;position:sticky;top:0;z-index:40;background:var(--bg);}
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand .wordmark{font-family:'Fraunces', serif;font-weight:600;font-size:22px;font-style:italic;letter-spacing:0.2px;}
  .brand .wordmark::before{content:"◆ ";font-size:14px;color:var(--progress);}
  .brand .tagline{font-size:11px;color:var(--ink-faint);font-style:italic;display:none;}
  @media (min-width:520px){ .brand .tagline{display:inline;} }
  .streak-badge{display:flex;align-items:center;gap:6px;background:var(--streak-bg);color:#7A5B0E;padding:6px 12px 6px 10px;border-radius:999px;font-weight:600;font-size:14px;}
  .streak-badge svg{width:15px;height:15px;}
  .nav-tabs{display:flex;gap:4px;background:var(--bg-deep);padding:4px;border-radius:999px;}
  .nav-tabs button{border:none;background:transparent;padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--ink-soft);}
  .nav-tabs button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-card);}

  .daynav{display:flex;align-items:center;gap:10px;padding:6px 20px 16px;}
  .daynav button.arrow{width:32px;height:32px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);display:flex;align-items:center;justify-content:center;}
  .daynav button.arrow svg{width:14px;height:14px;}
  .daynav .daylabel{font-family:'Fraunces', serif;font-size:19px;font-weight:500;flex:1;}
  .daynav .daylabel small{display:block;font-family:'IBM Plex Sans';font-size:12px;color:var(--ink-faint);font-weight:500;}
  .daynav button.today{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--ink-soft);}

  main{flex:1;padding:0 20px 24px;min-height:0;display:flex;flex-direction:column;}
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .column{background:var(--surface-alt);border-radius:var(--radius-lg);padding:12px;display:flex;flex-direction:column;min-height:320px;}
  .column-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .column-title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12.5px;letter-spacing:.01em;color:var(--ink-soft);}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .dot.todo{background:var(--todo);} .dot.progress{background:var(--progress);} .dot.done{background:var(--done);} .dot.suspended{background:var(--suspended);}
  .count{font-size:12px;color:var(--ink-faint);background:var(--surface);border-radius:999px;padding:2px 8px;}
  .add-row{display:flex;gap:6px;margin-bottom:10px;}
  .add-row input[type="text"]{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;background:var(--surface);}
  .add-row input:focus{outline:2px solid var(--progress);outline-offset:1px;}
  .due-input{border:1px solid var(--line);border-radius:8px;padding:9px 8px;font-size:12px;background:var(--surface);color:var(--ink-soft);width:124px;flex-shrink:0;}
  .due-picker-wrap{position:relative;}
  .due-input.due-btn{cursor:pointer;text-align:left;}
  .due-picker-dropdown{position:absolute;top:calc(100% + 6px);right:0;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:10px;box-shadow:var(--shadow-card);z-index:30;width:226px;}
  .cal-header-mini{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12.5px;font-weight:600;}
  .due-picker-dropdown .cal-grid-flex{height:150px;}
  .due-picker-dropdown .icon-btn{background:var(--surface-alt);}
  .due-clear-btn{margin-top:8px;width:100%;border:none;background:var(--surface-alt);color:var(--ink-soft);font-size:11.5px;padding:6px;border-radius:7px;}
  @media (max-width:767px){ .add-row{flex-wrap:wrap;position:relative;} .due-input{width:100%;} .due-picker-wrap{width:100%;} .due-picker-dropdown{right:0;left:0;width:auto;} }
  .cards{display:flex;flex-direction:column;gap:8px;flex:1;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;}
  .cards::-webkit-scrollbar{display:none;}
  .scroll-hint{font-size:10.5px;color:var(--ink-faint);text-align:center;padding-top:6px;flex-shrink:0;}
  .card{background:var(--surface);border-radius:var(--radius);padding:11px 12px;box-shadow:var(--shadow-card);border-left:8px solid var(--pri-low);text-align:left;width:100%;}
  .card.done-card{opacity:0.72;}
  .card.suspended-card{opacity:0.85;}
  .card-top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .card .title{font-weight:600;font-size:14.5px;line-height:1.35;}
  .card.done-card .title{text-decoration:line-through;text-decoration-color:var(--ink-faint);}
  .card-timer-badge{font-size:10.5px;font-weight:700;color:var(--progress);background:var(--progress-bg);padding:2px 6px;border-radius:6px;flex-shrink:0;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .card .meta{display:flex;gap:8px;margin-top:6px;font-size:12px;color:var(--ink-faint);flex-wrap:wrap;}
  .card .meta span{display:flex;align-items:center;gap:3px;}
  .suspend-elapsed{font-size:11.5px;color:var(--suspended);font-weight:600;margin-top:6px;}
  .resolve-btn{border:none;background:var(--streak);color:#fff;padding:7px 16px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;flex-shrink:0;}
  .card-progress-track{width:100%;height:4px;border-radius:999px;background:var(--line);margin-top:7px;overflow:hidden;}
  .card-progress-fill{height:100%;background:var(--done);border-radius:999px;transition:width .2s ease;}
  .log-caption{font-style:italic;font-size:10.5px;color:var(--ink-faint);text-align:right;margin-top:6px;line-height:1.3;}
  .empty-hint{color:var(--ink-faint);font-size:13px;padding:10px 2px;}

  .col-switch{display:none;gap:5px;padding:0 20px 12px;}
  .col-switch button{flex:1;border:1px solid var(--line-strong);background:var(--surface);padding:7px 4px;border-radius:8px;font-size:11.5px;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;gap:4px;}
  .col-switch button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .col-switch button .n{font-size:10px;opacity:.75;}

  .cal-wrap{display:flex;flex-direction:column;padding:8px 20px 10px;overflow:hidden;}
  .cal-header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .cal-header h2{font-family:'Fraunces';font-weight:500;font-size:17px;margin:0;}
  .cal-nav{display:flex;gap:6px;}
  .cal-nav button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);display:flex;align-items:center;justify-content:center;}
  .cal-nav button svg{width:12px;height:12px;}
  .cal-dow-row{flex-shrink:0;display:flex;margin-bottom:4px;}
  .cal-dow-row .cal-dow{flex:1;text-align:center;font-size:10px;color:var(--ink-faint);font-weight:600;}
  .cal-grid-flex{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);gap:4px;flex:1;min-height:0;}
  .cal-cell{width:100%;height:100%;padding:0;border:none;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-family:inherit;background:var(--surface-alt);color:var(--ink-soft);position:relative;}
  .cal-cell.pad{background:transparent;}
  .cal-cell.active{background:var(--active-day-bg);color:var(--active-day-fg);font-weight:700;}
  .cal-cell.future{color:var(--ink-faint);}
  .cal-cell.today-cell{box-shadow:0 0 0 2px var(--ink) inset;}
  .cal-cell.selected-cell{outline:2px solid var(--progress);outline-offset:-2px;}
  .cal-cell.freeze-cell{background:#C7C7C2;color:var(--ink-soft);}
  .cal-footer{flex-shrink:0;padding-top:8px;}
  .cal-legend-compact{display:flex;gap:14px;font-size:11px;color:var(--ink-soft);margin-bottom:6px;flex-wrap:wrap;}
  .cal-legend-compact span{display:flex;align-items:center;gap:5px;}
  .legend-swatch{width:9px;height:9px;border-radius:3px;display:inline-block;}
  .streak-stats-compact{display:flex;gap:8px;}
  .streak-stats-compact > div{flex:1;background:var(--surface-alt);border-radius:10px;padding:6px 8px;text-align:center;}
  .streak-stats-compact strong{display:block;font-family:'Fraunces';font-size:16px;font-weight:600;line-height:1.1;}
  .streak-stats-compact span{font-size:9.5px;color:var(--ink-faint);}

  .trash-wrap{padding:0 20px 24px;}
  .trash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .log-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;}
  .log-grid::-webkit-scrollbar{display:none;}
  @media (max-width:1100px){ .log-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:640px){ .log-grid{grid-template-columns:1fr;} }
  .trash-item{background:var(--surface-alt);border-radius:12px;padding:12px 14px;}
  @media (max-width:1100px){ .trash-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:640px){ .trash-grid{grid-template-columns:1fr;} }
  .trash-item .title{font-weight:600;font-size:14.5px;}
  .trash-item .meta{font-size:11.5px;color:var(--ink-faint);margin-top:3px;}

  .dash-wrap{padding:0 20px 24px;}
  .dash-toggle{display:flex;gap:4px;background:var(--bg-deep);padding:4px;border-radius:999px;width:max-content;margin-bottom:16px;}
  .dash-toggle button{border:none;background:transparent;padding:7px 16px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-soft);}
  .dash-toggle button.active{background:var(--surface);color:var(--ink);}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
  .stat-card{background:var(--surface-alt);border-radius:14px;padding:16px;}
  .stat-card .num{font-family:'Fraunces';font-size:28px;font-weight:600;}
  .stat-card .lbl{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .chart-card{background:var(--surface-alt);border-radius:14px;padding:18px 18px 14px;margin-bottom:16px;}
  .chart-card h3{margin:0 0 14px;font-family:'Fraunces';font-weight:500;font-size:16px;}
  .bars{display:flex;align-items:flex-end;gap:6px;height:140px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .bar{width:100%;background:var(--progress);border-radius:4px 4px 2px 2px;min-height:2px;}
  .bar-col .blabel{font-size:10px;color:var(--ink-faint);margin-top:5px;}
  /* Throughput chart: created vs completed, grouped bars */
  .cchart{display:flex;align-items:flex-end;height:192px;border-bottom:2px solid var(--progress);}
  .cchart-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;border-radius:10px;}
  .cchart-col.sel{background:var(--bg);}
  .cpair{display:flex;align-items:flex-end;gap:4px;}
  .cbar{position:relative;display:block;padding:0;border:0;cursor:pointer;width:30px;border-radius:5px 5px 0 0;}
  .cbar.year{width:20px;border-radius:4px 4px 0 0;}
  .cbar.created{background:var(--ink-soft);}
  .cbar.done{background:var(--done);}
  .cbar .ctip{display:none;position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:5px 9px;border-radius:7px;z-index:5;pointer-events:none;}
  .cbar:hover .ctip,.cbar:focus-visible .ctip{display:block;}
  .cchip{font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:999px;margin-bottom:8px;white-space:nowrap;border:1.5px solid transparent;}
  .cchip.year{font-size:11.5px;padding:2px 6px;}
  .cchip.good{background:var(--done-bg);color:var(--active-day-fg);}
  .cchip.bad{background:#F0DAD3;color:#8A3220;}
  .cchip.none{color:var(--ink-faint);}
  .cchip.now{border-style:dashed;}
  .cchip.good.now{border-color:var(--active-day-fg);}
  .cchip.bad.now{border-color:#8A3220;}
  .clabels{display:flex;margin-top:14px;}
  .clabels div{flex:1;min-width:0;text-align:center;font-size:12px;color:var(--ink-faint);}
  .clegend{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);}
  .clegend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px;}
  .cdetail{display:flex;align-items:center;gap:28px;flex-wrap:wrap;background:var(--surface);border-radius:12px;padding:12px 20px;margin-top:14px;box-shadow:var(--shadow-card);}
  .cdetail .lbl{font-size:12px;color:var(--ink-soft);}
  .cdetail .val{font-family:'Fraunces',serif;font-size:24px;font-weight:600;}
  .cdetail .val.good{color:var(--active-day-fg);}
  .cdetail .val.bad{color:#8A3220;}
  .cdetail .val.none{color:var(--ink-faint);}
  .trow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:16px;}
  .trow .chart-card{margin-bottom:0;min-width:0;}
  .trow .cbar{width:18px;} .trow .cbar.year{width:11px;}
  .trow .cpair{gap:2px;}
  .trow .cchip{font-size:11px;padding:2px 6px;} .trow .cchip.year{font-size:9px;padding:1px 3px;}
  .trow .cdetail{gap:16px;}
  @media (max-width:899px){
    .trow{grid-template-columns:1fr;}
    .trow .cbar{width:30px;} .trow .cbar.year{width:20px;}
    .trow .cpair{gap:4px;}
    .trow .cchip{font-size:12.5px;padding:2px 9px;} .trow .cchip.year{font-size:11.5px;padding:2px 6px;}
  }
  .tchart{width:100%;height:auto;display:block;overflow:visible;}
  .tchart .tdot{cursor:pointer;outline:none;}
  .tchart .tdot:hover .tr,.tchart .tdot:focus .tr{r:9;}
  .tchart text{font-family:'IBM Plex Sans',sans-serif;}
  @media(max-width:767px){
    .cbar{width:14px;} .cbar.year{width:8px;}
    .cchart-col .cpair{gap:2px;}
    .cchip{font-size:10.5px;padding:2px 5px;} .cchip.year{font-size:9px;padding:1px 3px;}
  }
  .log-list{display:flex;flex-direction:column;gap:8px;margin-top:4px;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;}
  .log-list::-webkit-scrollbar{display:none;}
  .resp-list{display:flex;flex-direction:column;gap:10px;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;}
  .resp-list::-webkit-scrollbar{display:none;}
  .log-item{background:var(--surface);border-radius:10px;padding:10px 12px;}
  .log-item-title{font-weight:600;font-size:13.5px;}
  .log-item-time{font-size:10.5px;color:var(--ink-faint);margin-top:2px;}
  .perf-block{margin-bottom:16px;}
  .perf-block:last-child{margin-bottom:0;}
  .perf-user-label{font-size:13px;font-weight:600;margin-bottom:6px;}
  .perf-bar-row{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--surface);margin-bottom:6px;}
  .perf-seg{height:100%;}
  .perf-seg.early{background:var(--done);}
  .perf-seg.ontime{background:var(--pri-none);}
  .perf-seg.overdue{background:var(--danger);}
  .perf-legend{display:flex;gap:12px;font-size:10.5px;color:var(--ink-soft);flex-wrap:wrap;}
  .perf-row-flex{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .perf-pct{font-family:'Fraunces';font-weight:600;font-size:16px;color:var(--ink);min-width:48px;text-align:right;flex-shrink:0;}
  .perf-legend span{display:flex;align-items:center;gap:5px;}

  .overlay{position:fixed;inset:0;background:rgba(35,32,26,0.42);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .overlay.center{align-items:center;justify-content:center;}
  .modal{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;}
  .modal::-webkit-scrollbar{display:none;}
  @media (min-width:768px){ .overlay{align-items:center;} .modal{border-radius:18px;max-height:80vh;} }
  .modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px;}
  .modal-head input.title-input{font-family:'Fraunces';font-size:20px;font-weight:600;border:none;background:transparent;width:100%;padding:2px 0;}
  .modal-head input.title-input:focus{outline:none;border-bottom:1px solid var(--line-strong);}
  .icon-btn{border:none;background:var(--surface-alt);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .icon-btn svg{width:13px;height:13px;}
  .status-line{display:flex;align-items:center;gap:8px;margin:8px 0 14px;flex-wrap:wrap;}

  .tabbar button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-faint);font-size:10.5px;font-weight:600;padding:4px;}
  .tabbar button svg{width:19px;height:19px;}

  .auth-input{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:14px;margin-bottom:8px;background:var(--surface);}
  .filter-toggle{display:flex;gap:4px;background:var(--bg-deep);padding:4px;border-radius:999px;}
  .filter-toggle button{border:none;background:transparent;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-soft);}

  .error-banner{background:var(--danger);color:#fff;padding:9px 16px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .error-banner .icon-btn{background:rgba(255,255,255,0.25);flex-shrink:0;}
  .error-banner .icon-btn svg{stroke:#fff;}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
  "use strict";

  /* ---------------- Supabase project config ---------------- */
  const SUPABASE_URL = 'https://scynlvlzswcdfuobjyew.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_8ozhRd9ihV6FzAkhver16g_lwSCbRQd';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const ICONS = {

    trash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a2 2 0 012-2h2a2 2 0 012 2v2"/></svg>`,
    projects: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>`,
  };

  const POMODORO_SEC = 25*60;
  const PRIORITIES = ['urgent','veryhigh','high','low'];

  let state = { tasks: [], trash: [], auditLog: [], profiles: [], projects: [], milestones: [], risks: [], blockers: [], executiveActions: [], projectMembers: [], retrospectives: [], units: [], taskShares: [] };
  let retroWeekStart = null;
  let expandedMilestoneId = null;
  let newProjectIsPI = false;
  let newProjectUnitId = '';
  let pendingExpunge = null;
  let showArchivedProjects = false;
  let addingUnit = false;
  let editingRetro = false;
  const DEFAULT_MILESTONE_NAMES = ['Define','Measure','Analyze','Improve','Control'];
  let selectedProjectId = null;
  let taskLinkProjectId = null;
  let executiveView = false;
  let view = "board";
  let mobileCol = "todo";
  let selectedDay = todayStr();
  let calMonth = new Date();
  let dashRange = "month";
  let chartSelected = null;
  let trendSel = {};
  let openTaskId = null;
  let pendingAction = null;
  let selectedSummaryDay = null;
  let tickHandle = null;
  let focusSubtaskInput = false;
  let futurePickerOpen = false;
  let futurePickerMonth = new Date();
  let editingSubtaskKey = null;
  let addTaskDueDate = null;
  let addDueMonth = new Date();
  let dueDropdownOpen = false;
  let keepDueOpen = false;
  let scope = 'all';            // 'all' | 'mine' | 'unit'
  let scopeUnitId = null;
  let unitPickerOpen = false;
  let appError = null;
  let addTaskTitleDraft = '';

  /* ---------------- Auth state ---------------- */
  let sbSession = null;
  let authView = 'loading'; // loading | signin | set-password | app
  let authEmail = '';
  let authPassword = '';
  let authError = null;
  let authNotice = null;
  let authBusy = false;
  let forgotMode = false;
  let newPassword1 = '';
  let newPassword2 = '';
  const isInviteOrRecoveryFlow = /type=invite|type=recovery/.test(window.location.hash);

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function todayStr(){ return dateToStr(new Date()); }
  function dateToStr(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function strToDate(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
  function addDays(s,n){ const d=strToDate(s); d.setDate(d.getDate()+n); return dateToStr(d); }
  function isFuture(s){ return s > todayStr(); }
  function isSunday(s){ return strToDate(s).getDay()===0; }
  function niceDayLabel(s){
    const d = strToDate(s);
    let label = d.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});
    let sub = "";
    if(s===todayStr()) sub="Today";
    else if(s===addDays(todayStr(),-1)) sub="Yesterday";
    else if(s===addDays(todayStr(),1)) sub="Tomorrow";
    else sub = d.getFullYear() !== new Date().getFullYear() ? String(d.getFullYear()) : "";
    return {label, sub};
  }
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeAttr(s){ return escapeHtml(s); }

  /* ---------------- Users / real auth ---------------- */
  function initialsFor(name){ return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
  function currentUserId(){ return sbSession && sbSession.user ? sbSession.user.id : null; }
  function profileName(userId){
    if(!userId) return 'Unknown';
    const p = state.profiles.find(p=>p.id===userId);
    return p ? p.display_name : 'Unknown';
  }
  function currentUserName(){ return profileName(currentUserId()); }

  async function submitSignIn(){
    authError = null; authNotice = null; authBusy = true; render();
    const { error } = await sb.auth.signInWithPassword({ email: authEmail.trim(), password: authPassword });
    authBusy = false;
    if(error){ authError = error.message; render(); return; }
    authPassword = '';
  }
  async function submitForgotPassword(){
    authError = null; authNotice = null; authBusy = true; render();
    const { error } = await sb.auth.resetPasswordForEmail(authEmail.trim(), { redirectTo: window.location.origin + window.location.pathname });
    authBusy = false;
    if(error){ authError = error.message; render(); return; }
    authNotice = 'Check your email for a reset link.';
    render();
  }
  async function submitSetPassword(){
    authError = null;
    if(newPassword1.length < 6){ authError = 'Password must be at least 6 characters.'; render(); return; }
    if(newPassword1 !== newPassword2){ authError = "Passwords don't match."; render(); return; }
    authBusy = true; render();
    const { error } = await sb.auth.updateUser({ password: newPassword1 });
    authBusy = false;
    if(error){ authError = error.message; render(); return; }
    history.replaceState(null, '', window.location.pathname);
    newPassword1 = ''; newPassword2 = '';
    authView = 'app';
    await reloadAllData();
    setupRealtime();
  }
  async function logout(){
    teardownRealtime();
    await sb.auth.signOut();
    authView = 'signin';
    render();
  }

  async function handleAuthChange(){
    if(sbSession && isInviteOrRecoveryFlow){
      authView = 'set-password';
      render();
      return;
    }
    if(sbSession){
      authView = 'app';
      await reloadAllData();
      setupRealtime();
    } else {
      teardownRealtime();
      authView = 'signin';
      render();
    }
  }
  async function bootstrapAuth(){
    const { data } = await sb.auth.getSession();
    sbSession = data.session;
    sb.auth.onAuthStateChange((_event, session)=>{
      sbSession = session;
      handleAuthChange();
    });
    await handleAuthChange();
  }

  /* ---------------- Data loading (Supabase) ---------------- */
  function taskFromRow(row){
    return {
      id: row.id,
      title: row.title,
      day: row.day,
      status: row.status,
      notes: row.notes || '',
      subtasks: (row.subtasks||[]).slice()
        .sort((a,b)=>(a.position||0)-(b.position||0))
        .sort((a,b)=>(b.done?1:0)-(a.done?1:0))
        .map(s=>({id:s.id, text:s.text, done:s.done})),
      priority: row.priority || 'low',
      dueDate: row.due_date,
      createdBy: profileName(row.created_by),
      createdByUserId: row.created_by,
      completedBy: profileName(row.completed_by),
      completedByUserId: row.completed_by,
      milestoneId: row.milestone_id,
      timer: { elapsed: Number(row.timer_elapsed_ms)||0, running: !!row.timer_running, startedAt: row.timer_started_at ? new Date(row.timer_started_at).getTime() : null },
      suspendedMs: Number(row.suspended_ms)||0,
      suspendStartedAt: row.suspend_started_at ? new Date(row.suspend_started_at).getTime() : null,
      createdAt: row.created_at,
      completedAt: row.completed_at,
      deletedAt: row.deleted_at,
      deletedBy: profileName(row.deleted_by),
      deleteReason: row.delete_reason,
    };
  }
  function auditFromRow(row){
    return { id: row.id, taskId: row.task_id, taskTitle: row.task_title, action: row.action, reason: row.reason, userId: row.user_id, username: profileName(row.user_id), timestamp: row.created_at };
  }

  let reloadInFlight = null;
  async function reloadAllData(){
    if(reloadInFlight) return reloadInFlight;
    reloadInFlight = (async ()=>{
      const [profilesRes, tasksRes, auditRes, projectsRes, milestonesRes, unitsRes] = await Promise.all([
        sb.from('profiles').select('*'),
        sb.from('tasks').select('*, subtasks(*)').order('created_at', {ascending:true}),
        sb.from('audit_log').select('*').order('created_at', {ascending:true}),
        sb.from('projects').select('*').order('created_at', {ascending:true}),
        sb.from('milestones').select('*').order('position', {ascending:true}),
        sb.from('units').select('*').order('created_at', {ascending:true}),
      ]);
      const err = profilesRes.error || tasksRes.error || auditRes.error || projectsRes.error || milestonesRes.error || unitsRes.error;
      if(err){ appError = err.message; render(); reloadInFlight = null; return; }
      state.profiles = profilesRes.data || [];
      const taskRows = tasksRes.data || [];
      state.tasks = taskRows.filter(r=>!r.deleted).map(taskFromRow);
      state.trash = taskRows.filter(r=>r.deleted).map(taskFromRow);
      state.auditLog = (auditRes.data || []).map(auditFromRow);
      state.units = (unitsRes.data || []).map(r=>({ id:r.id, name:r.name, code:r.code, createdBy:r.created_by }));
      state.projects = (projectsRes.data || []).map(r=>({ id:r.id, name:r.name, description:r.description||'', createdBy:r.created_by, createdAt:r.created_at, forecastCompletionDate:r.forecast_completion_date, isPI: !!r.is_pi, unitId: r.unit_id,
        archived: !!r.archived, archivedBy: profileName(r.archived_by), archiveReason: r.archive_reason,
        expungeRequested: !!r.expunge_requested, expungeRequestedBy: profileName(r.expunge_requested_by), expungeReason: r.expunge_reason, expungeDeclineReason: r.expunge_decline_reason }));
      state.milestones = (milestonesRes.data || []).map(r=>({ id:r.id, projectId:r.project_id, name:r.name, position:r.position, status:r.status }));
      const [risksRes, blockersRes, actionsRes] = await Promise.all([
        sb.from('risks').select('*').order('created_at', {ascending:true}),
        sb.from('blockers').select('*').order('created_at', {ascending:true}),
        sb.from('executive_actions').select('*').order('created_at', {ascending:true}),
      ]);
      if(risksRes.error || blockersRes.error || actionsRes.error){
        appError = (risksRes.error || blockersRes.error || actionsRes.error).message; render(); reloadInFlight = null; return;
      }
      state.risks = (risksRes.data || []).map(r=>({ id:r.id, projectId:r.project_id, title:r.title, severity:r.severity, status:r.status }));
      state.blockers = (blockersRes.data || []).map(r=>({ id:r.id, projectId:r.project_id, title:r.title, severity:r.severity, owner:r.owner||'', raisedDate:r.raised_date, targetResolutionDate:r.target_resolution_date, needsExecutiveSupport:r.needs_executive_support, status:r.status, resolvedBy: profileName(r.resolved_by), resolutionNote:r.resolution_note }));
      state.executiveActions = (actionsRes.data || []).map(r=>({ id:r.id, projectId:r.project_id, milestoneId:r.milestone_id, title:r.title, owner:r.owner||'', dueDate:r.due_date, priority:r.priority, status:r.status, closedBy: profileName(r.closed_by), closureNote:r.closure_note }));
      const [membersRes, retrosRes] = await Promise.all([
        sb.from('project_members').select('*'),
        sb.from('retrospectives').select('*'),
      ]);
      if(membersRes.error || retrosRes.error){
        appError = (membersRes.error || retrosRes.error).message; render(); reloadInFlight = null; return;
      }
      state.projectMembers = (membersRes.data || []).map(r=>({ id:r.id, projectId:r.project_id, userId:r.user_id, name: profileName(r.user_id) }));
      state.retrospectives = (retrosRes.data || []).map(r=>({ id:r.id, projectId:r.project_id, userId:r.user_id, weekStart:r.week_start, wentWell:r.went_well, notWell:r.not_well, learned:r.learned, nextPriority:r.next_priority }));
      const sharesRes = await sb.from('task_shares').select('*');
      state.taskShares = sharesRes.error ? [] : (sharesRes.data || []).map(r=>({ id:r.id, taskId:r.task_id, userId:r.user_id, name: profileName(r.user_id) }));
      await reconcileMilestones();
      render();
      reloadInFlight = null;
    })();
    return reloadInFlight;
  }

  let realtimeChannel = null;
  let reloadTimer = null;
  function scheduleReload(){ clearTimeout(reloadTimer); reloadTimer = setTimeout(reloadAllData, 200); }
  function setupRealtime(){
    if(realtimeChannel) return;
    realtimeChannel = sb.channel('vector-sync')
      .on('postgres_changes', {event:'*', schema:'public', table:'tasks'}, scheduleReload)
      .on('postgres_changes', {event:'*', schema:'public', table:'subtasks'}, scheduleReload)
      .on('postgres_changes', {event:'*', schema:'public', table:'audit_log'}, scheduleReload)
      .on('postgres_changes', {event:'*', schema:'public', table:'profiles'}, scheduleReload)
      .on('postgres_changes', {event:'*', schema:'public', table:'projects'}, scheduleReload)
      .on('postgres_changes', {event:'*', schema:'public', table:'milestones'}, scheduleReload)
      .on('postgres_changes', {event:'*', schema:'public', table:'units'}, scheduleReload)
      .on('postgres_changes', {event:'*', schema:'public', table:'task_shares'}, scheduleReload)
      .on('postgres_changes', {event:'*', schema:'public', table:'risks'}, scheduleReload)
      .on('postgres_changes', {event:'*', schema:'public', table:'blockers'}, scheduleReload)
      .on('postgres_changes', {event:'*', schema:'public', table:'executive_actions'}, scheduleReload)
      .on('postgres_changes', {event:'*', schema:'public', table:'project_members'}, scheduleReload)
      .on('postgres_changes', {event:'*', schema:'public', table:'retrospectives'}, scheduleReload)
      .subscribe();
  }
  function teardownRealtime(){
    if(realtimeChannel){ sb.removeChannel(realtimeChannel); realtimeChannel = null; }
  }

  async function runMutation(promiseFn){
    try{
      const { error } = await promiseFn();
      if(error){ appError = error.message; render(); return false; }
    }catch(e){ appError = (e && e.message) || 'Something went wrong.'; render(); return false; }
    appError = null;
    await reloadAllData();
    return true;
  }

  /* ---------------- Timer helpers ---------------- */
  function computeElapsed(t){
    let e = t.timer.elapsed;
    if(t.timer.running && t.timer.startedAt) e += (Date.now() - t.timer.startedAt);
    return e;

  function fmtElapsed(ms){
    const totalSec = Math.floor(ms/1000);
    const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
    return (h>0? String(h).padStart(2,'0')+':':'') + String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }
  function computeSuspendedElapsed(t){
    let ms = t.suspendedMs||0;
    if(t.status==='suspended' && t.suspendStartedAt) ms += (Date.now()-t.suspendStartedAt);

  }
  function formatDuration(ms){
    const totalSec = Math.floor(ms/1000);
    const totalDays = totalSec/86400;
    if(totalDays < 1) return fmtElapsed(ms);
    if(totalDays < 7){
      const days = Math.floor(totalDays);
      return `${days} day${days===1?'':'s'}`;
    }
    const totalWeeks = totalDays/7;
    if(totalWeeks < 30.44/7){
      const weeks = Math.floor(totalWeeks);
      return `${weeks} week${weeks===1?'':'s'}`;
    }
    const totalMonths = totalDays/30.44;
    if(totalMonths < 12){
      const months = Math.floor(totalMonths);
      return `${months} month${months===1?'':'s'}`;
    }
    const years = Math.floor(totalDays/365.25);
    const remMonths = Math.floor((totalDays - years*365.25)/30.44);
    return `${years} year${years===1?'':'s'}` + (remMonths>0? `, ${remMonths} month${remMonths===1?'':'s'}` : '');
  }

  /* ---------------- Streak math (personal, per logged-in user) ---------------- */
  function activeDaysSet(){
    const set = new Set();
    state.tasks.concat(state.trash).forEach(t=>{
      if(!t.completedAt) return;
      if(!taskInScope(t)) return;
      set.add(dateToStr(new Date(t.completedAt)));
    });
    return set;
  }
  function currentStreak(){
    const set=activeDaysSet();
    if(set.size===0) return 0;
    let count=0, cursor=todayStr(), first=true, guard=0;
    while(guard++<800){
      if(set.has(cursor)){ count++; }
      else{
        const sunday = isSunday(cursor);
        const todayGrace = first && cursor===todayStr();
        if(!sunday && !todayGrace) break;
      }
      cursor = addDays(cursor,-1);
      first = false;
    }
    return count;
  }
  function longestStreak(){
    const days=Array.from(activeDaysSet());
    if(days.length===0) return 0;
    const set=activeDaysSet();
    const sorted=days.slice().sort();
    let cursor=sorted[0];
    const end=sorted[sorted.length-1];
    let running=0, longest=0, guard=0;
    while(cursor<=end && guard++<3660){
      if(set.has(cursor)) running++;
      else if(!isSunday(cursor)) running=0;
      longest=Math.max(longest, running);
      cursor=addDays(cursor,1);
    }
    return longest;
  }

  /* ---------------- Performance ---------------- */
  function daysBetween(a,b){ return Math.round((strToDate(b)-strToDate(a))/86400000); }
  function taskEfficiency(t){
    if(!t.dueDate || t.status!=='done' || !t.completedAt) return null;
    const completedDay = dateToStr(new Date(t.completedAt));
    if(completedDay < t.dueDate) return {type:'early', diffDays: daysBetween(completedDay, t.dueDate)};
    if(completedDay === t.dueDate) return {type:'ontime', diffDays:0};
    return {type:'overdue', diffDays: daysBetween(t.dueDate, completedDay)};
  }
  function performanceByUser(){
    const map = {};
    state.tasks.filter(taskInScope).forEach(t=>{
      const eff = taskEfficiency(t);
      if(!eff) return;
      const user = t.createdBy || 'Unknown';
      if(!map[user]) map[user] = {early:0, ontime:0, overdue:0, overdueDaysTotal:0};
      map[user][eff.type]++;
      if(eff.type==='overdue') map[user].overdueDaysTotal += eff.diffDays;
    });
    return map;
  }

  function projectRingGradient(counts, total){
    if(!total) return 'var(--line)';
    const order = [['complete','var(--done)'],['awaiting_review','var(--streak)'],['in_progress','var(--progress)'],['not_started','var(--line-strong)']];
    let acc = 0, stops = [];
    order.forEach(([key,color])=>{
      const n = counts[key]||0;
      if(!n) return;
      const start = acc;
      acc += (n/total)*100;
      stops.push(`${color} ${start}% ${acc}%`);
    });
    return stops.length ? `conic-gradient(${stops.join(', ')})` : 'var(--line)';

  function computeMilestoneBaseline(m){
    const linked = tasksForMilestone(m.id);
    if(linked.length===0) return 'not_started';
    if(linked.every(t=>t.status==='done')) return 'all_done';
    const anyTouched = linked.some(t=>t.status!=='todo');
    return anyTouched ? 'in_progress' : 'not_started';
  }
  async function reconcileMilestones(){
    const writes = [];
    state.milestones.forEach(m=>{
      const baseline = computeMilestoneBaseline(m);
      let target = m.status;
      if(baseline==='all_done'){
        if(m.status!=='complete') target = 'awaiting_review';
      } else {
        target = baseline;

      if(target !== m.status){
        m.status = target;
        writes.push(sb.from('milestones').update({status:target}).eq('id', m.id));
      }
    });

  /* ---------------- Executive health scoring ---------------- */
  function isTaskOverdue(t){ return !!(t.dueDate && t.status!=='done' && t.dueDate < todayStr()); }
  function projectHealth(pid){
    const ms = milestonesForProject(pid);
    const msTotal = ms.length;
    const msComplete = ms.filter(m=>m.status==='complete').length;
    const msScore = msTotal ? (msComplete/msTotal)*100 : 0;

    const linkedTasks = state.tasks.filter(t=>ms.some(m=>m.id===t.milestoneId));
    const taskTotal = linkedTasks.length;
    const overdueCount = linkedTasks.filter(isTaskOverdue).length;
    const suspendedCount = linkedTasks.filter(t=>t.status==='suspended').length;
    const overdueScore = taskTotal ? Math.max(0, 100 - (overdueCount/taskTotal)*100) : 100;
    const suspendedScore = taskTotal ? Math.max(0, 100 - (suspendedCount/taskTotal)*100) : 100;

    const openBlockersCount = blockersForProject(pid).filter(b=>b.status==='open').length;
    const blockerScore = Math.max(0, 100 - openBlockersCount*25);

    const score = Math.round(msScore*0.40 + overdueScore*0.25 + suspendedScore*0.15 + blockerScore*0.20);
    const bucket = score>=85 ? 'green' : score>=60 ? 'amber' : 'red';
    return { score, bucket, msTotal, msComplete, openBlockersCount };
  }

    return `<div class="error-banner"><span>${escapeHtml(appError)}</span><button class="icon-btn" data-dismiss-error>${ICONS.x}</button></div>`;
  }

  function ensureTicking(){
    const anyRunning = state.tasks.some(t=>t.timer && t.timer.running);
    const anySuspended = state.tasks.some(t=>t.status==='suspended');
    const needsTick = anyRunning || anySuspended;
    if(needsTick && !tickHandle){ tickHandle = setInterval(tickTimers, 1000); }
    if(!needsTick && tickHandle){ clearInterval(tickHandle); tickHandle = null; }
  }
  function tickTimers(){
    document.querySelectorAll('[data-timer-digital]').forEach(el=>{
      const t = getTask(el.dataset.timerDigital); if(!t) return;
      el.textContent = fmtElapsed(computeElapsed(t));
    });
    document.querySelectorAll('[data-timer-escalating]').forEach(el=>{
      const t = getTask(el.dataset.timerEscalating); if(!t) return;
      el.textContent = formatDuration(computeElapsed(t));
    });
    document.querySelectorAll('[data-timer-ring]').forEach(el=>{
      const t = getTask(el.dataset.timerRing); if(!t) return;
      const totalSec = Math.floor(computeElapsed(t)/1000);
      const frac = (totalSec % POMODORO_SEC)/POMODORO_SEC;
      const C = parseFloat(el.dataset.circumference);
      el.style.strokeDashoffset = String(C*(1-frac));
    });
    document.querySelectorAll('[data-timer-sessions]').forEach(el=>{
      const t = getTask(el.dataset.timerSessions); if(!t) return;
      el.textContent = String(Math.floor(Math.floor(computeElapsed(t)/1000)/POMODORO_SEC));
    });
    document.querySelectorAll('[data-suspend-elapsed]').forEach(el=>{
      const t = getTask(el.dataset.suspendElapsed); if(!t) return;
      el.textContent = 'Suspended ' + formatDuration(computeSuspendedElapsed(t));
    });
  }

  function fitScrollListGroup(selector, cap){
    document.querySelectorAll(selector).forEach(container=>{
      const items = Array.from(container.children).filter(el=>!el.classList.contains('scroll-hint'));
      if(items.length <= cap){ container.style.maxHeight = 'none'; return; }
      const gapPx = parseFloat(getComputedStyle(container).rowGap) || 8;
      let total = 0;
      for(let i=0;i<cap;i++){ total += items[i].getBoundingClientRect().height; }
      total += gapPx * (cap-1);
      container.style.maxHeight = total + 'px';
    });
  }
  function fitScrollLists(){
    fitScrollListGroup('.cards, .log-list', 6);
    fitScrollListGroup('.resp-list', 3);
    fitScrollListGroup('.log-grid', 8);
  }

  function fitCalendarHeight(){
    const wrap = document.querySelector('.cal-wrap');
    if(!wrap) return;
    const topbar = document.querySelector('.topbar');
    const tabbar = document.querySelector('.tabbar');
    const topH = topbar ? topbar.getBoundingClientRect().height : 0;
    const tabH = tabbar ? tabbar.getBoundingClientRect().height : 0;
    const avail = Math.max(320, window.innerHeight - topH - tabH - 4);
    wrap.style.height = avail + 'px';
  }

  function bindAuthEvents(){
    const app = document.getElementById('app');
    const emailEl = app.querySelector('[data-auth-email]');
    if(emailEl) emailEl.addEventListener('input', ()=>{ authEmail = emailEl.value; });
    const pwEl = app.querySelector('[data-auth-password]');
    if(pwEl) pwEl.addEventListener('input', ()=>{ authPassword = pwEl.value; });
    const submitBtn = app.querySelector('[data-auth-submit]');
    if(submitBtn) submitBtn.addEventListener('click', ()=>{ forgotMode ? submitForgotPassword() : submitSignIn(); });
    const toggleForgot = app.querySelector('[data-auth-toggle-forgot]');
    if(toggleForgot) toggleForgot.addEventListener('click', ()=>{ forgotMode=!forgotMode; authError=null; authNotice=null; render(); });
    [emailEl,pwEl].forEach(el=>{ if(el) el.addEventListener('keydown', e=>{ if(e.key==='Enter'){ forgotMode ? submitForgotPassword() : submitSignIn(); } }); });

    const pw1 = app.querySelector('[data-new-pw1]');
    if(pw1) pw1.addEventListener('input', ()=>{ newPassword1=pw1.value; });
    const pw2 = app.querySelector('[data-new-pw2]');
    if(pw2) pw2.addEventListener('input', ()=>{ newPassword2=pw2.value; });
    const setPwBtn = app.querySelector('[data-set-password-submit]');
    if(setPwBtn) setPwBtn.addEventListener('click', submitSetPassword);

    for(let d=1; d<=daysInMonth; d++){
      const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const active = activeSet.has(ds);
      const fut = isFuture(ds);
      const isToday = ds===todayStr();

        cells += `<div class="cal-cell ${fut?'future':''} ${freeze?'freeze-cell':''} ${isToday?'today-cell':''}">${d}</div>`;
      }
    }
    const totalCells = startPad + daysInMonth;
    for(let i=0;i<(42-totalCells);i++) cells += `<div class="cal-cell pad"></div>`;
    const dows = ['S','M','T','W','T','F','S'];

  /* ---------------- Projects view ---------------- */
  function renderOneProjectCard(p){
    if(executiveView){
      const h = projectHealth(p.id);
      const pct = h.msTotal ? Math.round((h.msComplete/h.msTotal)*100) : 0;
      const ring = `conic-gradient(${healthColor(h.bucket)} 0% ${pct}%, var(--line) ${pct}% 100%)`;
      const openRisks = risksForProject(p.id).filter(r=>r.status==='open').length;
      const openActions = actionsForProject(p.id).filter(a=>a.status==='open').length;
      return `
      <button class="card" style="display:flex;align-items:center;gap:18px;width:100%;border-left:none;padding:18px 20px;" data-open-project="${p.id}">
        <div style="position:relative;width:84px;height:84px;flex-shrink:0;">
          <div style="width:100%;height:100%;border-radius:50%;background:${ring};"></div>
          <div style="position:absolute;inset:12px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;">
            <span class="serif" style="font-weight:600;font-size:17px;">${pct}%</span>
          </div>
        </div>
        <div style="flex:1;min-width:0;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;">
            <span class="title">${escapeHtml(p.name)}</span>
            <span style="font-size:10.5px;font-weight:700;border-radius:999px;padding:3px 10px;${healthPillStyle(h.bucket)}">${healthLabel(h.bucket)}</span>
            ${p.unitId ? `<span style="font-size:9.5px;font-weight:700;background:var(--bg-deep);color:var(--ink-soft);border-radius:999px;padding:2px 8px;">${escapeHtml(unitById(p.unitId)?.code||'')}</span>` : ''}
          </div>
          <div style="display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-soft);">
            <span><strong style="color:var(--danger);">${h.openBlockersCount}</strong> blocker${h.openBlockersCount===1?'':'s'} · <strong>${openRisks}</strong> risk${openRisks===1?'':'s'} · <strong style="color:var(--streak);">${openActions}</strong> action${openActions===1?'':'s'}</span>
            <span style="color:var(--ink-faint);">${p.forecastCompletionDate ? `Forecast ${p.forecastCompletionDate}` : 'No forecast set'}</span>
          </div>
        </div>
      </button>`;
    }
    const { counts, total } = milestoneStatusCounts(p.id);
    const pct = total ? Math.round((counts.complete/total)*100) : 0;
    const ring = projectRingGradient(counts, total);
    const rows = [
      ['Complete', counts.complete, 'var(--done)'],
      ['Awaiting review', counts.awaiting_review, 'var(--streak)'],
      ['In progress', counts.in_progress, 'var(--progress)'],
      ['Not started', counts.not_started, 'var(--line-strong)'],
    ];
    return `
    <button class="card" style="display:flex;align-items:center;gap:18px;width:100%;border-left:none;padding:18px 20px;" data-open-project="${p.id}">
      <div style="position:relative;width:84px;height:84px;flex-shrink:0;">
        <div style="width:100%;height:100%;border-radius:50%;background:${ring};"></div>
        <div style="position:absolute;inset:12px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;">
          <span class="serif" style="font-weight:600;font-size:17px;">${pct}%</span>
        </div>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;gap:7px;margin-bottom:2px;flex-wrap:wrap;">
          <span class="title">${escapeHtml(p.name)}</span>
          ${p.isPI ? `<span style="font-size:9.5px;font-weight:700;background:var(--suspended-bg);color:var(--suspended);border-radius:999px;padding:2px 7px;">PI</span>` : ''}
          ${p.unitId ? `<span style="font-size:9.5px;font-weight:700;background:var(--bg-deep);color:var(--ink-soft);border-radius:999px;padding:2px 7px;">${escapeHtml(unitById(p.unitId)?.code||'')}</span>` : ''}
          ${p.archived ? `<span style="font-size:9.5px;font-weight:700;background:var(--line-strong);color:var(--ink-soft);border-radius:999px;padding:2px 7px;">Archived</span>` : ''}
        </div>
        <div class="meta" style="margin-bottom:6px;">${total} ${p.isPI?'stage':'milestone'}${total===1?'':'s'}${projectComplete(p.id) ? ` <span style="color:var(--done);font-weight:600;">· Complete</span>` : ''}</div>
        <div style="display:flex;flex-direction:column;gap:4px;">
          ${rows.filter(r=>r[1]>0).map(([label,count,color])=>`
            <div style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-soft);">
              <span style="width:7px;height:7px;border-radius:50%;background:${color};flex-shrink:0;"></span>
              <span style="flex:1;">${label}</span>
              <span style="color:var(--ink-faint);">${count}</span>
            </div>`).join('')}
        </div>
      </div>
    </button>`;

      ${executiveView ? '' : `

      ['wentWell', 'What went well'],
      ['notWell', "What didn't go well"],
      ['learned', 'What I learned'],
      ['nextPriority', "Next week's one priority"],

          <button type="button" class="icon-btn" data-retro-week-nav="-7">${ICONS.chevL}</button>
          <span style="font-size:12.5px;font-weight:600;">Week of ${formatWeekRange(weekStart)}</span>
          <button type="button" class="icon-btn" data-retro-week-nav="7">${ICONS.chevR}</button>
        </div>
      </div>
      ${lastPriority ? `
      <div style="background:var(--streak-bg);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:8px;margin-bottom:14px;">
        <span style="width:7px;height:7px;border-radius:50%;background:var(--streak);flex-shrink:0;"></span>
        <span style="font-size:12.5px;color:#7A5B0E;"><strong>Your priority last week:</strong> ${escapeHtml(lastPriority)}</span>
      </div>` : ''}
      ${members.length===0 ? `<p style="font-size:13px;color:var(--ink-faint);">No project members yet — ask a Journey Architect to add the team here first.</p>` : `

                  </div>
                  <div style="font-size:12.5px;line-height:1.45;">${escapeHtml(val)}</div>
                </div>` : `
                <div style="border:1.5px dashed var(--line-strong);border-radius:10px;padding:10px 12px;">
                  <div style="font-size:10px;font-weight:700;color:var(--ink-faint);margin-bottom:3px;">${escapeHtml(m.name)}${isOwn?' (you)':''}</div>
                  <div style="font-size:11.5px;color:var(--ink-faint);font-style:italic;">Not submitted yet</div>
                </div>`;
              }).join('')}
            </div>
          </div>`).join('')}
      </div>`}

          <textarea class="notes" placeholder="What I learned…" data-retro-field="learned">${(editingRetro && mine) ? escapeHtml(mine.learned) : ''}</textarea>
          <textarea class="notes" placeholder="Next week's one priority…" data-retro-field="nextPriority">${(editingRetro && mine) ? escapeHtml(mine.nextPriority) : ''}</textarea>
        </div>
        <button class="primary-btn" style="margin-top:10px;" data-save-retro="${pid}">Save my retro</button>

  /* ---------------- Throughput chart (created vs completed) ---------------- */
  // Created is counted by creation date, completed by completion date, both
  // limited to the active scope. Deleted tasks are not counted as created work.
  const THROUGHPUT_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  function throughputSeries(){
    const now = new Date();
    const isMonth = dashRange==='month';
    const n = isMonth ? 5 : 12;
    const labels = isMonth ? [1,2,3,4,5].map(w=>'Wk '+w) : THROUGHPUT_MONTHS.map(m=>m.slice(0,3));
    const fulls = isMonth ? [1,2,3,4,5].map(w=>'Week '+w) : THROUGHPUT_MONTHS;
    const created = new Array(n).fill(0), done = new Array(n).fill(0);
    const bucket = ts => {
      const d = new Date(ts);
      if(isNaN(d) || d.getFullYear()!==now.getFullYear()) return -1;
      if(isMonth){ if(d.getMonth()!==now.getMonth()) return -1; return Math.min(5, Math.ceil(d.getDate()/7)) - 1; }
      return d.getMonth();
    };
    state.tasks.filter(taskInScope).forEach(t=>{
      if(t.createdAt){ const b = bucket(t.createdAt); if(b>=0) created[b]++; }
      if(t.status==='done' && t.completedAt){ const b = bucket(t.completedAt); if(b>=0) done[b]++; }
    });
    const cur = isMonth ? Math.min(5, Math.ceil(now.getDate()/7)) - 1 : now.getMonth();
    return labels.map((label,i)=>({ label, full: fulls[i], created: created[i], done: done[i], current: i===cur }));
  }
  // change = (completed - created) / created. State comes from the raw counts,
  // never from the rounded percentage.
  function throughputMeasure(d){
    const fmt = raw => { const a = Math.abs(raw); return (a>0 && a<1) ? a.toFixed(1) : String(Math.round(a)); };
    if(d.created===0 && d.done===0) return { kind:'none', text:'\u2014' };
    if(d.created===0) return { kind:'good', text:'\u25B2 +'+d.done+(d.done===1?' task':' tasks') };
    if(d.done===d.created) return { kind:'good', text:'= 0%' };
    const raw = ((d.done - d.created) / d.created) * 100;
    return raw>0 ? { kind:'good', text:'\u25B2 +'+fmt(raw)+'%' } : { kind:'bad', text:'\u25BC \u2212'+fmt(raw)+'%' };
  }
  function throughputNote(d, m){
    let note;
    if(d.created===0 && d.done===0) note = 'nothing created or completed';
    else if(d.created===0) note = 'completed with nothing created';
    else if(d.done>d.created) note = 'more completed than created';
    else if(d.done===d.created) note = 'completed matches created';
    else note = 'fewer completed than created';
    return d.current ? 'So far \u00B7 '+note : note.charAt(0).toUpperCase()+note.slice(1);
  }
  function renderThroughputChart(){
    const data = throughputSeries();
    const isYear = dashRange==='year';
    const H = 150;
    const max = Math.max(1, ...data.map(d=>Math.max(d.created, d.done)));
    const barH = v => v ? Math.max(Math.round(v/max*H), 6) : 2;
    const sel = (chartSelected!==null && data[chartSelected]) ? chartSelected : null;
    const yc = isYear ? ' year' : '';
    const cols = data.map((d,i)=>{
      const m = throughputMeasure(d);
      return `
      <div class="cchart-col ${sel===i?'sel':''}">
        <div class="cchip ${m.kind}${yc}${d.current?' now':''}">${m.text}</div>
        <div class="cpair">
          <button type="button" class="cbar created${yc}" style="height:${barH(d.created)}px;" data-chart-pick="${i}" aria-label="${d.full}: created ${d.created}"><span class="ctip">Created \u00B7 ${d.created}</span></button>
          <button type="button" class="cbar done${yc}" style="height:${barH(d.done)}px;" data-chart-pick="${i}" aria-label="${d.full}: completed ${d.done}"><span class="ctip">Completed \u00B7 ${d.done}</span></button>
        </div>
      </div>`;
    }).join('');
    let detail = '';
    if(sel!==null){
      const d = data[sel], m = throughputMeasure(d);
      detail = `
      <div class="cdetail">
        <span class="serif" style="font-weight:500;font-size:17px;min-width:84px;">${d.full}</span>
        <div><div class="lbl"><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--ink-soft);margin-right:6px;"></i>Created</div><div class="val">${d.created}</div></div>
        <div><div class="lbl"><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--done);margin-right:6px;"></i>Completed</div><div class="val">${d.done}</div></div>
        <div><div class="lbl">Change</div><div class="val ${m.kind}">${m.text}</div></div>
        <span style="flex:1;font-size:12.5px;color:var(--ink-soft);">${throughputNote(d, m)}</span>
        <button type="button" class="icon-btn" aria-label="Close details" data-chart-close>${ICONS.x}</button>
      </div>`;
    }
    return `
    <div class="chart-card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;">
        <h3 style="margin:0;">Throughput by ${isYear?'month':'week'}</h3>
        <div class="clegend">
          <span><i style="background:var(--ink-soft);"></i>Created</span>
          <span><i style="background:var(--done);"></i>Completed</span>
          <span style="color:var(--ink-faint);">Change = (completed &minus; created) &divide; created</span>
        </div>
      </div>
      <div class="cchart">${cols}</div>
      <div class="clabels">${data.map(d=>`<div>${d.label}</div>`).join('')}</div>
      ${detail}
    </div>`;
  }

  /* ---------------- Cumulative trend (created vs completed, running totals) ---------------- */
  // Each point is the running total up to the end of that period, counted from the
  // beginning of time (dashboard: scope-limited; project page: that project only),
  // so the opening balance carried into the period is included.
  function trendBuckets(tasks, mode){
    const now = new Date(), Y = now.getFullYear(), M = now.getMonth();
    const SHORT = THROUGHPUT_MONTHS.map(m=>m.slice(0,3));
    const out = [];
    if(mode==='month'){
      const dim = new Date(Y, M+1, 0).getDate();
      for(let w=1; w<=5; w++){
        const startDay = (w-1)*7+1;
        const endDay = w===5 ? dim : Math.min(w*7, dim);
        if(startDay>dim) break;
        out.push({ label:'Wk '+w, full:'Week '+w, start:new Date(Y,M,startDay,0,0,0,0).getTime(), end:new Date(Y,M,endDay,23,59,59,999).getTime() });
      }
    } else if(mode==='year'){
      for(let m=0; m<12; m++) out.push({ label:SHORT[m], full:THROUGHPUT_MONTHS[m], start:new Date(Y,m,1).getTime(), end:new Date(Y,m+1,0,23,59,59,999).getTime() });
    }
    const nowTs = now.getTime();
    const cr = tasks.filter(t=>t.createdAt).map(t=>new Date(t.createdAt).getTime());
    const dn = tasks.filter(t=>t.status==='done' && t.completedAt).map(t=>new Date(t.completedAt).getTime());
    let prevC = cr.filter(x=>x<out[0].start).length, prevD = dn.filter(x=>x<out[0].start).length;
    out.forEach(b=>{
      b.elapsed = b.start<=nowTs;
      b.current = b.start<=nowTs && nowTs<=b.end;
      if(b.elapsed){
        b.cumC = cr.filter(x=>x<=b.end).length;
        b.cumD = dn.filter(x=>x<=b.end).length;
        b.addC = b.cumC-prevC; b.addD = b.cumD-prevD;
        prevC=b.cumC; prevD=b.cumD;
      }
    });
    return out;
  }
  function trendAxis(vals){
    const hi = Math.max(1, ...vals), lo = Math.min(...vals);
    const rough = hi/4;
    const steps = [1,2,5,10,20,25,50,100,200,250,500,1000,2000,5000];
    let step = steps.find(x=>x>=rough) || 5000;
    let min = 0;
    if(lo>=hi*0.5 && lo>0){ min = Math.floor((lo*0.8)/step)*step; }
    let max = Math.ceil(hi/step)*step; if(max===hi && hi>0) max += step;
    // keep about 4-5 intervals
    while((max-min)/step>5) step = steps[steps.indexOf(step)+1] || step*2;
    max = min + Math.ceil((hi-min)/step+0.0001)*step;
    const ticks=[]; for(let v=min; v<=max; v+=step) ticks.push(v);
    return { min, max, ticks };
  }
  function renderTrendChart(key, mode, tasks){
    const b = trendBuckets(tasks, mode);
    const el = b.filter(x=>x.elapsed);
    const n = b.length;
    const title = mode==='month' ? 'Cumulative trend by week' : 'Cumulative trend by month';
    const empty = el.length===0 || (el[el.length-1].cumC===0 && el[el.length-1].cumD===0);
    if(empty){
      return `<div class="chart-card"><h3>${title}</h3><p style="font-size:13px;color:var(--ink-faint);margin:0;">No tasks yet to chart.</p></div>`;
    }
    // Start the line at the first period that has any task in scope; earlier periods
    // keep their labels but get no dots or line. vis keeps each point's bucket index.
    const firstIdx = b.findIndex(x=>x.elapsed && (x.cumC>0 || x.cumD>0));
    const vis = b.map((x,i)=>({x,i})).filter(o=>o.x.elapsed && o.i>=firstIdx);
    const axisVals = vis.flatMap(o=>[o.x.cumC,o.x.cumD]);
    if(firstIdx===0) axisVals.push(b[0].cumC-b[0].addC, b[0].cumD-b[0].addD);
    const axis = trendAxis(axisVals);
    const PW=800, PH=210, LEFT=44, TOP=14, BOT=34, VW=LEFT+PW+4, VH=TOP+PH+BOT;
    const xAt = i => LEFT + (i+0.5)*PW/n;
    const yAt = v => TOP + PH - ((v-axis.min)/(axis.max-axis.min))*PH;
    const f = v => v.toFixed(1);
    const selI = trendSel[key];
    const sel = (selI!==undefined && selI!==null && b[selI] && b[selI].elapsed && selI>=firstIdx) ? selI : null;
    const ptsC = vis.map(o=>f(xAt(o.i))+','+f(yAt(o.x.cumC)));
    const ptsD = vis.map(o=>f(xAt(o.i))+','+f(yAt(o.x.cumD)));
    const gap = vis.length>1 ? `<polygon points="${ptsC.concat(ptsD.slice().reverse()).join(' ')}" fill="rgba(98,99,107,0.16)"/>` : '';
    const grid = axis.ticks.map(t=>`<line x1="${LEFT}" x2="${LEFT+PW}" y1="${f(yAt(t))}" y2="${f(yAt(t))}" stroke="${t===axis.min?'#B96A20':'#DCD4C1'}" stroke-width="${t===axis.min?2:1}"/><text x="${LEFT-10}" y="${f(yAt(t)+4)}" text-anchor="end" font-size="12" fill="#97968D">${t}</text>`).join('');
    const xl = b.map((x,i)=>`<text x="${f(xAt(i))}" y="${TOP+PH+22}" text-anchor="middle" font-size="12" fill="${x.elapsed?'#97968D':'#C7BCA2'}">${escapeHtml(x.label)}</text>`).join('');
    const band = sel!==null ? `<rect x="${f(xAt(sel)-PW/n/2)}" y="${TOP}" width="${f(PW/n)}" height="${PH}" rx="10" fill="#EFEAE1"/>` : '';
    const line = (pts,c) => vis.length>1 ? `<polyline points="${pts.join(' ')}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>` : '';
    const dot = (x,i,v,c,name) => `<g class="tdot" tabindex="0" role="button" data-trend-pick="${key}|${i}" aria-label="${escapeHtml(x.full)}: ${name} total ${v}"><title>${name} · ${v} total</title><circle cx="${f(xAt(i))}" cy="${f(yAt(v))}" r="16" fill="transparent"/><circle class="tr" cx="${f(xAt(i))}" cy="${f(yAt(v))}" r="7" fill="${c}" stroke="#F6F2E8" stroke-width="3"/></g>`;
    const dotsC = vis.map(o=>dot(o.x,o.i,o.x.cumC,'#62636B','Created')).join('');
    const dotsD = vis.map(o=>dot(o.x,o.i,o.x.cumD,'#3F7D58','Completed')).join('');
    let detail='';
    if(sel!==null){
      const d=b[sel];
      detail = `
      <div class="cdetail">
        <span class="serif" style="font-weight:500;font-size:17px;min-width:84px;">${escapeHtml(d.full)}</span>
        <div><div class="lbl"><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ink-soft);margin-right:6px;"></i>Created, total</div><div class="val">${d.cumC}</div></div>
        <div><div class="lbl"><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--done);margin-right:6px;"></i>Completed, total</div><div class="val">${d.cumD}</div></div>
        <div><div class="lbl">Open backlog</div><div class="val">${d.cumC-d.cumD}</div></div>
        <span style="flex:1;font-size:12.5px;color:var(--ink-soft);">${d.current?'So far · ':''}+${d.addC} created, +${d.addD} completed this ${mode==='month'?'week':'month'}</span>
        <button type="button" class="icon-btn" aria-label="Close details" data-trend-close="${key}">${ICONS.x}</button>
      </div>`;
    }
    return `
    <div class="chart-card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;">
        <h3 style="margin:0;">${title}</h3>
        <div class="clegend">
          <span><i style="background:#62636B;border-radius:50%;"></i>Created</span>
          <span><i style="background:#3F7D58;border-radius:50%;"></i>Completed</span>
          <span><i style="background:rgba(98,99,107,0.16);width:16px;height:9px;"></i>Open backlog</span>
          ${axis.min>0?`<span style="color:var(--ink-faint);">Axis starts at ${axis.min}</span>`:''}
        </div>
      </div>
      <svg class="tchart" viewBox="0 0 ${VW} ${VH}" role="img" aria-label="${title}">${band}${grid}${gap}${line(ptsC,'#62636B')}${line(ptsD,'#3F7D58')}${dotsC}${dotsD}${xl}</svg>
      ${detail}
    </div>`;
  }

      <svg width="60" height="60" viewBox="0 0 64 64">
