  function bindEvents(){
    const app = document.getElementById('app');

    const dismissErr = app.querySelector('[data-dismiss-error]');
    if(dismissErr) dismissErr.addEventListener('click', ()=>{ appError=null; render(); });

    const logoutBtn = app.querySelector('[data-logout]');
    if(logoutBtn) logoutBtn.addEventListener('click', logout);

    app.querySelectorAll('[data-scope]').forEach(b=>b.addEventListener('click', ()=>{ scope=b.dataset.scope; scopeUnitId=null; selectedSummaryDay=null; chartSelected=null; delete trendSel.dash; render(); }));
    const scopeUnitBtn = app.querySelector('[data-scope-unit]');
    if(scopeUnitBtn) scopeUnitBtn.addEventListener('click', ()=>{ unitPickerOpen = true; render(); });
    app.querySelectorAll('[data-pick-unit]').forEach(b=>b.addEventListener('click', ()=>{
      scope='unit'; scopeUnitId=b.dataset.pickUnit; unitPickerOpen=false; addingUnit=false; selectedSummaryDay=null; chartSelected=null; delete trendSel.dash; render();
    }));
    const closeUnitOverlay = app.querySelector('[data-close-unit-picker]');
    if(closeUnitOverlay) closeUnitOverlay.addEventListener('click', e=>{ if(e.target===closeUnitOverlay){ unitPickerOpen=false; addingUnit=false; render(); } });
    const closeUnitBtn = app.querySelector('[data-close-unit-picker-btn]');
    if(closeUnitBtn) closeUnitBtn.addEventListener('click', ()=>{ unitPickerOpen=false; addingUnit=false; render(); });
    app.querySelectorAll('[data-exec-toggle]').forEach(b=>b.addEventListener('click', ()=>{ executiveView = b.dataset.execToggle==='executive'; render(); }));
    const showArchivedCheckbox = app.querySelector('[data-show-archived]');
    if(showArchivedCheckbox) showArchivedCheckbox.addEventListener('change', ()=>{ showArchivedProjects = showArchivedCheckbox.checked; render(); });

    const unitAddToggle = app.querySelector('[data-unit-add-toggle]');
    if(unitAddToggle) unitAddToggle.addEventListener('click', ()=>{ addingUnit = !addingUnit; render(); });
    const saveUnitBtn = app.querySelector('[data-save-unit]');
    if(saveUnitBtn) saveUnitBtn.addEventListener('click', ()=>{
      const nameEl = app.querySelector('[data-new-unit-name]');
      const codeEl = app.querySelector('[data-new-unit-code]');
      createUnit(nameEl.value, codeEl.value);
    });
    const projectUnitSelect = app.querySelector('[data-project-unit]');
    if(projectUnitSelect) projectUnitSelect.addEventListener('change', ()=>{ setProjectUnit(projectUnitSelect.dataset.projectUnit, projectUnitSelect.value); });

    app.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click', ()=>{ view=b.dataset.nav; selectedSummaryDay=null; dueDropdownOpen=false; selectedProjectId=null; render(); }));
    app.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click', ()=>{
      const n = parseInt(b.dataset.day,10);
      selectedDay = n===0 ? todayStr() : addDays(selectedDay, n);
      dueDropdownOpen=false;
      render();
    }));
    app.querySelectorAll('[data-mcol]').forEach(b=>b.addEventListener('click', ()=>{ mobileCol=b.dataset.mcol; render(); }));
    app.querySelectorAll('[data-cal]').forEach(b=>b.addEventListener('click', ()=>{
      calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+parseInt(b.dataset.cal,10), 1);
      selectedSummaryDay = null; render();
    }));
    app.querySelectorAll('[data-dash]').forEach(b=>b.addEventListener('click', ()=>{ dashRange=b.dataset.dash; chartSelected=null; delete trendSel.dash; render(); }));
    app.querySelectorAll('[data-chart-pick]').forEach(b=>b.addEventListener('click', ()=>{
      const i = parseInt(b.dataset.chartPick,10);
      chartSelected = chartSelected===i ? null : i;
      render();
    }));
    app.querySelectorAll('[data-trend-pick]').forEach(g=>{
      const go = ()=>{
        const [k,i] = g.dataset.trendPick.split('|'); const idx = parseInt(i,10);
        trendSel[k] = trendSel[k]===idx ? null : idx; render();
      };
      g.addEventListener('click', go);
      g.addEventListener('keydown', e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); go(); } });
    });
    app.querySelectorAll('[data-trend-close]').forEach(bn=>bn.addEventListener('click', ()=>{ trendSel[bn.dataset.trendClose]=null; render(); }));
    const chartCloseBtn = app.querySelector('[data-chart-close]');
    if(chartCloseBtn) chartCloseBtn.addEventListener('click', ()=>{ chartSelected=null; render(); });

    const addInput = app.querySelector('[data-add-input]');
    if(addInput){
      addInput.addEventListener('input', ()=>{ addTaskTitleDraft = addInput.value; });
      addInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ submitNewTaskFromRow(); } });
    }

    const dueToggleBtn = app.querySelector('[data-due-toggle]');
    if(dueToggleBtn){
      dueToggleBtn.addEventListener('focus', ()=>{ if(!dueDropdownOpen){ dueDropdownOpen = true; keepDueOpen = true; render(); } });
      dueToggleBtn.addEventListener('click', ()=>{ if(!dueDropdownOpen){ dueDropdownOpen = true; keepDueOpen = true; render(); } });
      dueToggleBtn.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); submitNewTaskFromRow(); } });
    }
    const dueCloseBtn = app.querySelector('[data-due-close]');
    if(dueCloseBtn) dueCloseBtn.addEventListener('click', ()=>{ dueDropdownOpen=false; keepDueOpen=false; render(); });
    app.querySelectorAll('[data-due-nav]').forEach(b=>b.addEventListener('click', ()=>{
      addDueMonth = new Date(addDueMonth.getFullYear(), addDueMonth.getMonth()+parseInt(b.dataset.dueNav,10), 1);
      keepDueOpen = true; render();
    }));
    app.querySelectorAll('[data-due-pick]').forEach(b=>b.addEventListener('click', ()=>{
      addTaskDueDate = b.dataset.duePick;
      keepDueOpen = true; render();
    }));
    const dueClearBtn = app.querySelector('[data-due-clear]');
    if(dueClearBtn) dueClearBtn.addEventListener('click', ()=>{ addTaskDueDate=null; keepDueOpen=true; render(); });

    app.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click', ()=>{ openTaskId=b.dataset.open; editingSubtaskKey=null; dueDropdownOpen=false; taskLinkProjectId=null; render(); }));
    const overlay = app.querySelector('[data-close-overlay]');
    if(overlay){
      overlay.addEventListener('click', e=>{ if(e.target===overlay){ openTaskId=null; editingSubtaskKey=null; taskLinkProjectId=null; render(); } });
    }
    const closeBtn = app.querySelector('[data-close]');
    if(closeBtn) closeBtn.addEventListener('click', ()=>{ openTaskId=null; editingSubtaskKey=null; taskLinkProjectId=null; render(); });

    const titleInput = app.querySelector('[data-title]');
    if(titleInput) titleInput.addEventListener('change', ()=>updateTitle(openTaskId, titleInput.value));

    const beginBtn = app.querySelector('[data-begin]');
    if(beginBtn) beginBtn.addEventListener('click', ()=>beginWork(beginBtn.dataset.begin));
    const doneBtn = app.querySelector('[data-done]');
    if(doneBtn) doneBtn.addEventListener('click', ()=>markDoneManually(doneBtn.dataset.done));

    app.querySelectorAll('[data-priority]').forEach(b=>b.addEventListener('click', ()=>{
      const [tid,p] = b.dataset.priority.split('|');
      setPriority(tid, p);
    }));

    app.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click', ()=>{
      pendingAction = { type: b.dataset.action, taskId: b.dataset.taskid };
      render();
    }));

    const actionOverlay = app.querySelector('[data-close-action]');
    if(actionOverlay){
      actionOverlay.addEventListener('click', e=>{ if(e.target===actionOverlay){ pendingAction=null; render(); } });
    }
    app.querySelectorAll('[data-unarchive-project]').forEach(b=>b.addEventListener('click', ()=>{ unarchiveProject(b.dataset.unarchiveProject); }));
    app.querySelectorAll('[data-open-expunge]').forEach(b=>b.addEventListener('click', ()=>{ pendingExpunge={projectId:b.dataset.openExpunge}; render(); }));
    const expungeOverlay = app.querySelector('[data-close-expunge]');
    if(expungeOverlay){
      expungeOverlay.addEventListener('click', e=>{ if(e.target===expungeOverlay){ pendingExpunge=null; render(); } });
    }
    const cancelExpungeBtn = app.querySelector('[data-cancel-expunge]');
    if(cancelExpungeBtn) cancelExpungeBtn.addEventListener('click', ()=>{ pendingExpunge=null; render(); });
    const confirmExpungeBtn = app.querySelector('[data-confirm-expunge]');
    if(confirmExpungeBtn){
      confirmExpungeBtn.addEventListener('click', ()=>{
        const input = app.querySelector('[data-expunge-confirm-input]');
        const p = state.projects.find(x=>x.id===pendingExpunge.projectId);
        if(!p || !input || input.value.trim() !== p.name){
          document.getElementById('expunge-error').style.display='block';
          return;
        }
        const pid = pendingExpunge.projectId;
        pendingExpunge = null;
        confirmExpunge(pid);
      });
    }
    const stopEls = app.querySelectorAll('[data-stop]');
    stopEls.forEach(el=>el.addEventListener('click', e=>e.stopPropagation()));
    const cancelActionBtn = app.querySelector('[data-cancel-action]');
    if(cancelActionBtn) cancelActionBtn.addEventListener('click', ()=>{ pendingAction=null; render(); });
    const confirmActionBtn = app.querySelector('[data-confirm-action]');
    if(confirmActionBtn){
      confirmActionBtn.addEventListener('click', ()=>{
        const reasonEl = app.querySelector('[data-action-reason]');
        const reason = reasonEl.value.trim();
        const username = currentUserName();
        if(!reason){ document.getElementById('action-error').style.display='block'; return; }
        const {type, taskId} = pendingAction;
        if(type==='delete') deleteTaskWithLog(taskId, reason, username);
        if(type==='reopen') reopenTaskWithLog(taskId, reason, username);
        if(type==='resume') resumeTaskWithLog(taskId, reason, username);
        if(type==='suspend') suspendTaskWithLog(taskId, reason, username);
        if(type==='restore') restoreTaskWithLog(taskId, reason, username);
        if(type==='milestone_approve') approveMilestone(taskId, reason);
        if(type==='milestone_reject') rejectMilestone(taskId, reason);
        if(type==='delete_milestone') deleteMilestoneWithReason(taskId, reason);
        if(type==='resolve_blocker') resolveBlockerWithReason(taskId, reason);
        if(type==='archive_project') archiveProjectWithReason(taskId, reason);
        if(type==='request_expunge') requestExpungeWithReason(taskId, reason);
        if(type==='decline_expunge') declineExpungeWithReason(taskId, reason);
        if(type==='close_executive_action') closeExecutiveActionWithReason(taskId, reason);
        pendingAction=null; openTaskId=null; render();
      });
    }

    app.querySelectorAll('[data-toggle-sub]').forEach(b=>b.addEventListener('click', ()=>{
      const [tid,sid] = b.dataset.toggleSub.split('|'); toggleSubtask(tid,sid);
    }));
    app.querySelectorAll('[data-del-sub]').forEach(b=>b.addEventListener('click', ()=>{
      const [tid,sid] = b.dataset.delSub.split('|'); deleteSubtask(tid,sid);
    }));
    app.querySelectorAll('[data-start-edit-sub]').forEach(b=>b.addEventListener('click', ()=>{
      startEditSubtask(b.dataset.startEditSub);
    }));
    const editInput = app.querySelector('[data-edit-sub]');
    if(editInput){
      let committed = false;
      const commit = ()=>{
        if(committed) return; committed = true;
        const [tid,sid] = editInput.dataset.editSub.split('|');
        commitEditSubtask(tid, sid, editInput.value);
      };
      editInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); commit(); } });
      editInput.addEventListener('blur', commit);
    }
    const addSubInput = app.querySelector('[data-add-sub]');
    if(addSubInput) addSubInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ addSubtask(addSubInput.dataset.addSub, addSubInput.value); } });
    const notesArea = app.querySelector('[data-notes]');
    if(notesArea) notesArea.addEventListener('input', ()=>updateNotes(notesArea.dataset.notes, notesArea.value));

    app.querySelectorAll('[data-day-click]').forEach(b=>b.addEventListener('click', ()=>{
      const ds = b.dataset.dayClick;
      selectedSummaryDay = (selectedSummaryDay===ds) ? null : ds;
      render();
    }));
    const closeSummaryOverlay = app.querySelector('[data-close-summary]');
    if(closeSummaryOverlay) closeSummaryOverlay.addEventListener('click', e=>{ if(e.target===closeSummaryOverlay){ selectedSummaryDay=null; render(); } });
    const closeSummaryBtn = app.querySelector('[data-close-summary-btn]');
    if(closeSummaryBtn) closeSummaryBtn.addEventListener('click', ()=>{ selectedSummaryDay=null; render(); });

    const futureOpenBtn = app.querySelector('[data-future-open]');
    if(futureOpenBtn) futureOpenBtn.addEventListener('click', ()=>{
      futurePickerMonth = strToDate(selectedDay);
      futurePickerOpen = true; render();
    });
    const closePickerOverlay = app.querySelector('[data-close-picker]');
    if(closePickerOverlay) closePickerOverlay.addEventListener('click', e=>{ if(e.target===closePickerOverlay){ futurePickerOpen=false; render(); } });
    const closePickerBtn = app.querySelector('[data-close-picker-btn]');
    if(closePickerBtn) closePickerBtn.addEventListener('click', ()=>{ futurePickerOpen=false; render(); });
    app.querySelectorAll('[data-picker-nav]').forEach(b=>b.addEventListener('click', ()=>{
      futurePickerMonth = new Date(futurePickerMonth.getFullYear(), futurePickerMonth.getMonth()+parseInt(b.dataset.pickerNav,10), 1);
      render();
    }));
    app.querySelectorAll('[data-pick-date]').forEach(b=>b.addEventListener('click', ()=>{
      selectedDay = b.dataset.pickDate;
      futurePickerOpen = false;
      render();
    }));

    app.querySelectorAll('[data-project-type]').forEach(b=>b.addEventListener('click', ()=>{ newProjectIsPI = b.dataset.projectType==='pi'; render(); }));
    const newProjectUnitSelect = app.querySelector('[data-new-project-unit]');
    if(newProjectUnitSelect) newProjectUnitSelect.addEventListener('change', ()=>{ newProjectUnitId = newProjectUnitSelect.value; });
    const createProjectBtn = app.querySelector('[data-create-project]');
    if(createProjectBtn) createProjectBtn.addEventListener('click', ()=>{
      const input = app.querySelector('[data-new-project-name]');
      if(input){ createProject(input.value, newProjectIsPI, newProjectUnitId); newProjectIsPI = false; newProjectUnitId = ''; }
    });
    const newProjectInput = app.querySelector('[data-new-project-name]');
    if(newProjectInput) newProjectInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ createProject(newProjectInput.value, newProjectIsPI, newProjectUnitId); newProjectIsPI = false; newProjectUnitId = ''; } });
    const newMilestoneInput = app.querySelector('[data-new-milestone-name]');
    if(newMilestoneInput) newMilestoneInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ addMilestone(newMilestoneInput.dataset.newMilestoneName, newMilestoneInput.value); } });

    const forecastInput = app.querySelector('[data-forecast-date]');
    if(forecastInput) forecastInput.addEventListener('change', ()=>{ setProjectForecastDate(forecastInput.dataset.forecastDate, forecastInput.value); });

    const newBlockerTitle = app.querySelector('[data-new-blocker-title]');
    if(newBlockerTitle) newBlockerTitle.addEventListener('keydown', e=>{
      if(e.key==='Enter'){
        const sev = app.querySelector('[data-new-blocker-severity]');
        createBlocker(newBlockerTitle.dataset.newBlockerTitle, newBlockerTitle.value, sev ? sev.value : 'medium');
      }
    });


    const newActionTitle = app.querySelector('[data-new-action-title]');
    if(newActionTitle) newActionTitle.addEventListener('keydown', e=>{
      if(e.key==='Enter'){
        const due = app.querySelector('[data-new-action-due]');
        createExecutiveAction(newActionTitle.dataset.newActionTitle, newActionTitle.value, due ? due.value : null);
      }
    });

    app.querySelectorAll('[data-remove-member]').forEach(b=>b.addEventListener('click', ()=>{ removeProjectMember(b.dataset.removeMember); }));
    const newMemberSelect = app.querySelector('[data-new-member-select]');
    if(newMemberSelect) newMemberSelect.addEventListener('change', ()=>{
      if(newMemberSelect.value) addProjectMember(newMemberSelect.dataset.newMemberSelect, newMemberSelect.value);
    });
    app.querySelectorAll('[data-retro-week-nav]').forEach(b=>b.addEventListener('click', ()=>{
      retroWeekStart = addDays(getRetroWeekStart(), parseInt(b.dataset.retroWeekNav,10));
      editingRetro = false;
      render();
    }));
    const saveRetroBtn = app.querySelector('[data-save-retro]');
    if(saveRetroBtn) saveRetroBtn.addEventListener('click', ()=>{
      const vals = {};
      app.querySelectorAll('[data-retro-field]').forEach(el=>{ vals[el.dataset.retroField] = el.value; });
      editingRetro = false;
      saveMyRetro(saveRetroBtn.dataset.saveRetro, getRetroWeekStart(), vals);
    });
    app.querySelectorAll('[data-edit-retro]').forEach(b=>b.addEventListener('click', ()=>{ editingRetro = true; render(); }));

    app.querySelectorAll('[data-add-milestone-task]').forEach(inp=>inp.addEventListener('keydown', e=>{
      if(e.key==='Enter'){
        const mid = inp.dataset.addMilestoneTask;
        const dueInput = app.querySelector(`[data-add-milestone-task-due="${mid}"]`);
        createTaskForMilestone(mid, inp.value, dueInput ? dueInput.value : null);
      }
    }));
    app.querySelectorAll('[data-request-delete-milestone]').forEach(b=>b.addEventListener('click', ()=>{
      const id = b.dataset.requestDeleteMilestone;
      if(tasksForMilestone(id).length>0){ appError = "Can't delete a milestone that still has linked tasks — unlink or move them first."; render(); return; }
      pendingAction = { type:'delete_milestone', taskId:id };
      render();
    }));
    app.querySelectorAll('[data-open-project]').forEach(b=>b.addEventListener('click', ()=>{ selectedProjectId=b.dataset.openProject; retroWeekStart=null; expandedMilestoneId=null; editingRetro=false; newProjectIsPI=false; render(); }));
    app.querySelectorAll('[data-toggle-milestone]').forEach(b=>b.addEventListener('click', ()=>{
      const id = b.dataset.toggleMilestone;
      expandedMilestoneId = expandedMilestoneId===id ? null : id;
      render();
    }));
    const backToProjectsBtn = app.querySelector('[data-back-to-projects]');
    if(backToProjectsBtn) backToProjectsBtn.addEventListener('click', ()=>{ selectedProjectId=null; render(); });
    const taskProjectPicker = app.querySelector('[data-task-project-picker]');
    if(taskProjectPicker) taskProjectPicker.addEventListener('change', ()=>{
      taskLinkProjectId = taskProjectPicker.value;
      if(!taskProjectPicker.value) setTaskMilestone(openTaskId, null);
      render();
    });
    const sharePicker = app.querySelector('[data-share-picker]');
    if(sharePicker) sharePicker.addEventListener('change', ()=>{ shareTask(sharePicker.dataset.sharePicker, sharePicker.value); });
    app.querySelectorAll('[data-unshare]').forEach(b=>b.addEventListener('click', ()=>{ unshareTask(b.dataset.unshare); }));
    const taskMilestonePicker = app.querySelector('[data-task-milestone-picker]');
    if(taskMilestonePicker) taskMilestonePicker.addEventListener('change', ()=>{
      setTaskMilestone(taskMilestonePicker.dataset.taskMilestonePicker, taskMilestonePicker.value || null);
    });

    const exportBtn = app.querySelector('[data-export-data]');
    if(exportBtn) exportBtn.addEventListener('click', ()=>{
      const payload = JSON.stringify({tasks: state.tasks, trash: state.trash, auditLog: state.auditLog}, null, 2);
      const filename = 'vector-export-' + todayStr() + '.json';
      const blob = new Blob([payload], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  }

  let lastResizeWidth = window.innerWidth;
  window.addEventListener('resize', ()=>{
    if(window.innerWidth === lastResizeWidth) return;
    lastResizeWidth = window.innerWidth;
    render();
  });

  bootstrapAuth();
})();
</script>
</body>
</html>
